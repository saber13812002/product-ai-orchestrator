# =============================================================================
# .gitlab-ci.yml — AI Product Orchestrator (GitLab CI on the self-hosted
# shell runner, tag: server52)
#
# Pipeline: push to main (or Run pipeline manually)
#   ├─ test   : hermetic tests in a throwaway python:3.13-slim container
#   │          (no LLM / LiteLLM / API key / cost) — scripts/ci-docker.sh
#   └─ deploy : sync to the persistent stack dir + `docker compose up -d --build`
#              + health-wait — scripts/deploy-repo.sh
#
# NOTE: the self-hosted runner uses the `shell` executor, so a Docker `image:`
# would be IGNORED. Instead `test` shells out to a container itself. See
# docs/GITLAB-CI.md and docs/DEVELOPMENT.md.
# =============================================================================

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"     # Run pipeline manually

stages: [test, deploy]

# ------------------------------------------------------------------ Test
# Hermetic: no LiteLLM / LLM / API key / model network. Runs in a container
# launched by the shell runner (the runner itself has docker).
test:
  stage: test
  tags: [server52]
  timeout: 30m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - bash scripts/ci-docker.sh

# ------------------------------------------------------------------ Deploy
# Rebuild + redeploy the app from the persistent stack dir on this server.
# Skipped for merge requests (never deploy from an MR); runs on main, tags,
# and manual "Run pipeline".
deploy:
  stage: deploy
  tags: [server52]
  timeout: 45m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    # persistent stack home (same path the manual deploy uses)
    DEPLOY_DIR: /home/saber/saberprojects/ai-product-orchestrator
  script:
    - bash scripts/deploy-repo.sh
